    <link

      href="assets/favicon_close_logo.ico"
    />
    <link
      rel="icon"
      type="image/x-icon"

    />
    <link

  <body id="page-top" class="thank-you-page d-flex flex-column min-vh-100">
    <nav
      class="navbar navbar-expand-lg bg-secondary text-uppercase fixed-top"
      id="mainNav"
    >
      <div class="container">
        <a class="navbar-brand" href="index.html#page-top">AW. Smith</a>
        <button
          class="navbar-toggler text-uppercase font-weight-bold bg-primary text-white rounded"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive"
          aria-controls="navbarResponsive"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          Menu
          <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item mx-0 mx-lg-1">
              <a
                class="nav-link py-3 px-0 px-lg-3 rounded"
                href="index.html#page-top"
                >Home</a
              >
            </li>
           </li>
          </ul>
        </div>
      </div>
    </nav>

    <main
      class="page-section masthead-bg text-white text-center d-flex align-items-center justify-content-center thank-you-main"
    >
      <div class="container">
        <h1 class="masthead-heading">
          <span id="typed-text"></span>
        </h1>
      </div>
    </main>

    <div class="copyright py-4 text-center text-white">
      <div class="container"><small>Copyright &copy; aw.smith 2026</small></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        new Typed("#typed-text", {
          strings: ["Your Email was Successfully Sent. Thank you"],
          typeSpeed: 50,
          backSpeed: 30,
          backDelay: 2000,
          loop: true,
        });
      });
    </script>
  </body>
